<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Work Intelligence</title>
    <link rel="stylesheet" href="/static/ui.css" />
  </head>
  <body>
    <nav class="nav">
      <a class="nav-brand" href="/auth/login">
        <div class="nav-logo">⚡</div>
        Work Intelligence
      </a>
    </nav>

    <main class="shell">
      <section class="hero" style="text-align:center; max-width:400px; margin:80px auto;">
        <div class="hero-eyebrow">Daily Work Intelligence</div>
        <h1 class="hero-title" style="font-size:2rem;">Sign in</h1>
        <p class="hero-sub">Connect your workspace and get an intelligent daily briefing.</p>

        {% if error %}
          <div class="banner banner-error" style="margin-top:16px;">{{ error }}</div>
        {% endif %}

        <a class="btn btn-primary" href="/auth/google" style="width:100%; justify-content:center; margin-top:24px; gap:10px;">
          Sign in with Google
        </a>
      </section>
    </main>
  </body>
</html>
